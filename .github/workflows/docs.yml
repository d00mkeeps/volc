name: Auto-Generate Documentation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auto-Generate Documentation
        run: |
          python3 scripts/volcano_docgen.py --title "Volc AI Gym Coach"

      - name: Commit and Push Documentation Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update API and architecture specs [skip ci]"
          file_pattern: 'docs/* README.md'

      - name: Report CI Failure to Observer & Loki
        if: failure()
        run: |
          curl -s -X POST https://observer.mileshillary.com/ci/failure \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "actor": "${{ github.actor }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "error_step": "Documentation Generation Failed",
              "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || true
